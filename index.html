<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Museum Builder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23f5e6c4'/%3E%3Cpath d='M10 10h28v12h-8v16H10z' fill='none' stroke='%233b2f24' stroke-width='3' stroke-linejoin='round'/%3E%3Crect x='14' y='14' width='8' height='8' fill='%232f6f85'/%3E%3Crect x='14' y='26' width='8' height='8' fill='%23d98f94'/%3E%3Crect x='26' y='26' width='8' height='8' fill='%232f6f85'/%3E%3Cpath d='M38 36v8' stroke='%23f2c230' stroke-width='5'/%3E%3C/svg%3E" />
    <style>
      :root { --fg: #1a1a1a; --bg: #fff; --muted: #4a4a4a; --line: #767676; --accent: #0b57d0; --bad: #a3001b; --good: #0a6b2f; --soft: #f3f4f6; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      header, main { max-width: 75rem; margin: 0 auto; padding: 1rem; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
      h1 { font-size: 1.75rem; margin: 0; } h2 { font-size: 1.375rem; } h3 { font-size: 1.125rem; margin: 0 0 .25rem; }
      button { font: inherit; padding: .5rem .875rem; border: 2px solid var(--fg); border-radius: .375rem; background: var(--bg); color: var(--fg); cursor: pointer; min-height: 2.75rem; }
      button[aria-pressed="true"], button[aria-expanded="true"] { background: var(--fg); color: var(--bg); }
      button[aria-disabled="true"] { border-style: dashed; color: var(--muted); cursor: not-allowed; }
      button.small { min-height: 2rem; padding: .125rem .5rem; margin-left: .5rem; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .skip { position: absolute; left: 1rem; top: -4rem; background: var(--fg); color: var(--bg); padding: .5rem 1rem; z-index: 10; }
      .skip:focus { top: .5rem; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .lang { display: flex; gap: .5rem; }
      .note { color: var(--muted); font-style: italic; }
      .budget {  }
      .budget dl { display: flex; gap: 2rem; flex-wrap: wrap; margin: 0; }
      dt { font-weight: 600; } dd { margin: 0; }
      .card dl > div, .budget dl > div { display: flex; gap: .5rem; }
      progress { width: 100%; height: 1rem; }
      .announce { min-height: 1.5em; margin: .25rem 0 0; font-weight: 600; }
      ul.room { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
      .card, .room > li { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; }
      .card.off { background: var(--soft); }
      .flag { font-weight: 600; color: var(--bad); margin: .25rem 0; }
      .flag::before { content: "⚠ "; }
      .bad { color: var(--bad); font-weight: 600; } .good { color: var(--good); font-weight: 600; }
      .room > li.sel { border: 3px solid var(--accent); }
      button.link { border: 0; background: none; padding: 0; min-height: 0; font-weight: 700; text-decoration: underline; }
      .scene { position: relative; z-index: 0; isolation: isolate; height: 100%; min-height: 24rem; border-radius: .75rem; overflow: hidden; background: radial-gradient(circle at 50% 40%, #3a322b, #1f1b18); }
      .scene-bar { position: absolute; top: .5rem; left: .5rem; z-index: 20; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
      .scene-bar .hint { background: #fff; color: var(--fg); padding: .25rem .5rem; border-radius: .375rem; font-size: .875rem; }
      .hud { max-width: none; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, auto); gap: .5rem 1.25rem; align-items: center; background: #3b2f24; color: #fff; padding: .5rem 1rem; }
      .hud { box-shadow: inset 0 -3px 0 #d98f94; padding: .25rem 1rem .375rem; gap: .25rem 1rem; }
      .hud .brand svg { width: 34px; height: 34px; } .hud .brand { font-size: 1.25rem; }
      .hud .budget dl > div { flex-direction: row !important; justify-content: center; align-items: baseline; gap: .5rem !important; }
      .hud .budget dd { font-size: 1.125rem !important; } .hud .budget dl { margin-bottom: .125rem !important; } .hud .budget dt { font-size: .6875rem !important; }
      .hud-right, .hud-right * { white-space: nowrap; } .hud-right { gap: .5rem !important; } .hud-right a { font-size: .875rem; }
      @media (max-width: 64rem) { .brand > span { display: none; } .hud { grid-template-columns: auto minmax(0, 1fr) auto; } }
      .hud .announce { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; min-height: 0; } .hud button { min-height: 2rem !important; padding-block: 0; } .hud .brief { display: none; }
      .brand { display: flex; align-items: center; gap: .625rem; font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; line-height: 1; margin: 0; }
      .brand .b2 { color: #e9c48a; }
      .hud .budget dl > div { background: rgba(255,255,255,.12); border-radius: 999px; padding: .125rem .75rem; } .hud a { color: #fff; } .hud .note { color: #e8dcc4; }
      .hud .brief p { margin: 0; } .hud summary { cursor: pointer; }
      .hud details ul { margin: .25rem 0; padding-left: 1.25rem; }
      .hud .budget dl { gap: 1rem; } .hud .announce { font-size: .875rem; margin: 0; }
      .hud progress { height: .625rem; }
      .intro { max-width: 32rem; border: 4px solid #8b6b4a; border-radius: .75rem; background: #efe3c8; color: #2b2118; padding: 1.25rem 1.5rem; }
      .intro::backdrop { background: transparent; } .intro.tour { margin: 0; inset: auto; position: fixed; width: min(24rem, calc(100vw - 1rem)); }
      .spot { position: fixed; z-index: 50; border-radius: .5rem; box-shadow: 0 0 0 4px #f2c230, 0 0 0 100vmax rgba(20,15,10,.7); pointer-events: none; }
      .intro-nav { display: flex; gap: .5rem; justify-content: flex-end; align-items: center; margin-top: 1rem; }
      .intro:not(.tour)::backdrop { background: rgba(20,15,10,.7); } .intro h2 { margin-top: 0; } .intro li { margin-bottom: .5rem; }
      .hud .budget { max-width: 40rem; width: 100%; justify-self: center; }
      .hud .budget dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: .375rem; }
      .hud .budget dl > div { display: flex; flex-direction: column-reverse; align-items: center; gap: 0; border-radius: .5rem; padding: .125rem .5rem; text-align: center; }
      .hud .budget dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #e8dcc4; }
      .hud .budget dd { margin: 0; font-size: 1.375rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .hud .budget dl > .left { background: #f2c230; color: #2b2118; } .hud .budget dl > .left dt { color: #2b2118; }
      .hud .budget progress { height: .75rem; }
      .hud .announce { text-align: center; min-height: 1.1em; }
      .intro .note { font-size: .875rem; }
      .intro .levels { border: 0; padding: 0; margin: .5rem 0; } .intro .levels legend { font-weight: 700; padding: 0; } .intro .levels label { display: block; padding: .25rem 0; } .intro .levels input { margin-right: .5rem; }
      .hud button.submit { background: #f2c230; border-color: #f2c230; color: #2b2118; font-weight: 800; }
      .hud button.submit:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      .hud .budget { min-width: 0; } .hud .visitor { margin: 0 0 .25rem; min-width: 0; font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e8dcc4; }
      .hud-right { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 1rem; align-items: center; }
      .hud button { min-height: 2.25rem; }
      main { max-width: none; padding: 0; }
      .play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18rem, 24rem); height: max(30rem, calc(100vh - 4.5rem)); background: #1f1b18; }
      .play > .scene { margin: 0; border-radius: 0; height: 100%; min-height: 0; }
      .toolkit { display: flex; flex-direction: column; gap: .5rem; min-height: 0; padding: .625rem; background: #efe3c8; color: #2b2118; border-left: 4px solid #8b6b4a; }
      .tabs { display: flex; gap: .375rem; flex-wrap: wrap; }
      .tabs button { background: #fff8e6; border-color: #8b6b4a; color: #2b2118; padding: .125rem .625rem; min-height: 2.25rem; font-size: .875rem; }
      .tabs button[aria-pressed="true"] { background: #4f6b3f; color: #fff; border-color: #2e4023; }
      .tiles { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 6rem; display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr)); align-content: start; }
      .tiles button { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; gap: .125rem; padding: .375rem .25rem; background: #fff8e6; border: 2px solid #8b6b4a; color: #2b2118; text-align: center; }
      .tiles button[aria-pressed="true"] { background: #4f6b3f; color: #fff; border-color: #2e4023; }
      .tiles li:has(button[aria-disabled="true"]) button { background: #e3dac4; border-style: dashed; }
      .ico { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; font-size: 1.25rem; border-radius: .5rem; background: rgba(0,0,0,.07); }
      .tname { font-size: .8125rem; line-height: 1.2; font-weight: 600; }
      .tcost { font-size: .8125rem; }
      .detail { max-height: 45%; overflow-y: auto; background: #fff8e6; border: 2px solid #8b6b4a; border-radius: .5rem; padding: .5rem .625rem; font-size: .875rem; }
      .detail h3 { font-size: 1rem; margin: 0 0 .25rem; } .detail p { margin: .25rem 0; } .detail .src { color: #4a3d2e; }
      .tag { display: inline-block; background: #dfe9d8; color: #2e4023; border-radius: 999px; padding: 0 .5rem; font-weight: 600; }
      .targets { border: 1px solid #8b6b4a; border-radius: .5rem; display: flex; flex-wrap: wrap; gap: .375rem; margin-top: .5rem; }
      .targets button { min-height: 2.25rem; padding: .125rem .625rem; font-size: .875rem; }
      @media (max-width: 40rem) { .hud { grid-template-columns: 1fr; } .hud .budget dd { font-size: 1.125rem; } .play { grid-template-columns: 1fr; height: auto; } .play > .scene { height: 60vh; } .toolkit { border-left: 0; } .tiles { max-height: 20rem; } }
      .zlabel { display: inline-flex; align-items: center; background: #3b2f24; color: #fff; border: 2px solid #fff; border-radius: 999px; min-height: 1.75rem; min-width: 1.75rem; padding: 0 .375rem; font-weight: 600; font-size: .875rem; white-space: nowrap; justify-content: center; }
      .zname { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .zlabel:hover .zname, .zlabel:focus-visible .zname, .zlabel[aria-pressed="true"] .zname, .picking .zname { position: static; width: auto; height: auto; overflow: visible; clip: auto; margin-left: .375rem; }
      .zlabel[aria-pressed="true"] { background: #f2c230; color: #1a1a1a; border-color: #1a1a1a; }
      .elabel { background: #3b2f24; color: #fff; padding: .125rem .6rem; border-radius: .375rem; font-weight: 600; font-size: .85rem; white-space: nowrap; }
      .elabel.small { font-size: .75rem; padding: 0 .4rem; }
      .glyph { background: #fff; color: #1a1a1a; border: 1px solid #1a1a1a; border-radius: .4rem; padding: 0 .3rem; font-size: .95rem; }
      .glyph.warn { background: #fff3cd; color: #7a0016; font-weight: 700; }
      .seg { color: var(--muted); margin-bottom: .25rem; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
    </style>

    <div id="root"></div>

</html>
